<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RentFood</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="logo">🍰 RentFood</div>

        <nav class="menu">

            <button onclick="mostrar('todos')">Todos</button>
            <button onclick="mostrar('chocolate')">Chocolate</button>
            <button onclick="mostrar('frutas')">Frutas</button>
            <a href="#contato">Contato</a>

        </nav>

        <div class="carrinho-icon" onclick="abrirCarrinho()">
            🛒 <span id="contador">0</span>
        </div>

    </header>

    <section class="produtos">

        <div class="card chocolate">
            <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587">
            <h3>Bolo Chocolate</h3>
            <p>R$ 25</p>
            <button onclick="adicionar('Bolo Chocolate', 25)">Adicionar</button>
        </div>

        <div class="card chocolate">
            <img src="bolobri.jpg">
            <h3>Bolo Brigadeiro</h3>
            <p>R$ 30</p>
            <button onclick="adicionar('Bolo Brigadeiro', 30)">Adicionar</button>
        </div>

        <div class="card frutas">
            <img src="bolomo.png">
            <h3>Bolo Morango</h3>
            <p>R$ 28</p>
            <button onclick="adicionar('Bolo Morango', 28)">Adicionar</button>
        </div>

        <div class="card frutas">
            <img src="bololim.webp">
            <h3>Bolo Limão</h3>
            <p>R$ 22</p>
            <button onclick="adicionar('Bolo Limão', 22)">Adicionar</button>
        </div>

    </section>

    <section id="contato" class="contato">
        <h2>Contato</h2>
        <p>Email: contato@rentfood.com</p>
        <p>Telefone: (14) 99999-9999</p>
    </section>

    <div class="overlay" id="overlay" onclick="fecharCarrinho()"></div>

    <div class="carrinho" id="carrinho">

        <h2>Seu Pedido</h2>

        <ul id="lista"></ul>

        <p id="total">Total: R$ 0</p>

        <button onclick="concluirCompra()">Concluir Compra</button>
        <button onclick="limparCarrinho()">Limpar Carrinho</button>

        <button onclick="fecharCarrinho()">Fechar</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
